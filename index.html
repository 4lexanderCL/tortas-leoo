<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tortas Leoo">
<meta name="theme-color" content="#B5231A">
<title>Tortas Ahogadas Leoo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --salsa: #B5231A;
    --salsa-oscura: #7F1610;
    --salsa-clara: #F9DDD8;
    --birote: #E0A84B;
    --birote-claro: #F6D9A0;
    --crema: #FFF5E6;
    --tarjeta: #FFFBF4;
    --cafe: #3B2314;
    --cafe-claro: #6B4A35;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--crema);
    color: var(--cafe);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
  }
  button { font: inherit; cursor: pointer; border: none; }
  input { font: inherit; }

  /* ---------- Encabezado rojo con escurrido ---------- */
  header {
    background: var(--salsa);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 20px 4px;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
  header p { margin: 2px 0 0; color: var(--birote-claro); font-size: 14px; }
  .fila-header { display: flex; align-items: center; gap: 8px; }
  .fila-header .grow { flex: 1; min-width: 0; }
  .btn-header {
    background: transparent; color: var(--birote-claro);
    padding: 8px 10px; border-radius: 10px; font-weight: 600;
  }
  .btn-header:active { background: rgba(255,255,255,.12); }
  .escurrido { display: block; position: absolute; left: 0; bottom: -21px; width: 100%; height: 22px; }

  main { padding: 32px 16px 120px; max-width: 640px; margin: 0 auto; }

  /* ---------- Campos ---------- */
  .campo {
    width: 100%; padding: 14px 16px; margin-bottom: 10px;
    background: var(--tarjeta); color: var(--cafe);
    border: 1.5px solid var(--birote); border-radius: 16px; outline: none;
  }
  .campo:focus { border-color: var(--salsa); }
  .campo::placeholder { color: var(--cafe-claro); }

  /* ---------- Tarjetas de órdenes ---------- */
  .orden {
    display: flex; overflow: hidden; margin-bottom: 12px;
    background: var(--tarjeta); border: 1.5px solid var(--birote); border-radius: 18px;
  }
  .orden .franja { width: 8px; background: var(--salsa); flex-shrink: 0; }
  .orden .cuerpo { flex: 1; padding: 14px; min-width: 0; }
  .orden .arriba { display: flex; justify-content: space-between; gap: 8px; }
  .orden .numero {
    display: inline-block; background: var(--salsa); color: #fff;
    font-size: 14px; font-weight: 900; padding: 2px 9px; border-radius: 10px;
    margin-right: 8px; vertical-align: 2px;
  }
  .orden .cliente { font-weight: 900; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .orden .total { font-weight: 900; font-size: 20px; color: var(--salsa); }
  .orden .fecha { font-size: 12px; color: var(--cafe-claro); }
  .orden .resumen { font-size: 14px; margin-top: 4px; }
  .orden .acciones { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }

  .btn { padding: 10px 18px; border-radius: 22px; font-weight: 700; }
  .btn-rojo { background: var(--salsa); color: #fff; }
  .btn-rojo:active { background: var(--salsa-oscura); }
  .btn-texto { background: transparent; color: var(--cafe-claro); }
  .btn-dorado { background: var(--birote); color: var(--cafe); }

  .vacio { text-align: center; color: var(--cafe-claro); margin-top: 48px; line-height: 1.5; }

  .fab {
    position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
    background: var(--birote); color: var(--cafe);
    font-weight: 900; padding: 16px 22px; border-radius: 18px;
    box-shadow: 0 6px 16px rgba(59,35,20,.25); z-index: 6;
  }
  .fab:active { transform: scale(.97); }

  /* ---------- Menú de productos ---------- */
  .categoria { color: var(--salsa); font-weight: 900; font-size: 20px; margin: 18px 0 8px; }
  .producto {
    display: flex; align-items: center; gap: 6px;
    background: var(--tarjeta); border: 1px solid var(--birote-claro); border-radius: 16px;
    padding: 8px 10px 8px 14px; margin-bottom: 8px;
  }
  .producto .info { flex: 1; min-width: 0; }
  .producto .nombre { font-weight: 700; }
  .producto .precio { color: var(--salsa); font-weight: 700; font-size: 14px; }
  .circulo {
    width: 44px; height: 44px; border-radius: 50%;
    font-size: 22px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .menos { background: transparent; color: var(--salsa); border: 1.5px solid var(--salsa); }
  .menos:disabled { opacity: .35; }
  .mas { background: var(--salsa); color: #fff; }
  .cantidad { width: 36px; text-align: center; font-weight: 900; font-size: 18px; }

  .otro-form { display: flex; gap: 8px; align-items: stretch; margin-top: 4px; }
  .otro-form .campo { margin: 0; min-width: 0; }
  .otro-form .nom { flex: 2; }
  .otro-form .pre { flex: 0 0 96px; }
  .otro-form button { padding: 0 16px; border-radius: 16px; font-weight: 800; }
  .extra-nota { font-size: 13px; color: var(--cafe-claro); margin: 0 0 8px; }

  /* ---------- Separador por día ---------- */
  .dia {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 2px dashed var(--birote);
  }
  .dia:first-child { margin-top: 4px; }
  .dia .nombre-dia { font-weight: 900; font-size: 18px; color: var(--cafe); }
  .dia .resumen-dia { font-size: 13px; color: var(--cafe-claro); }
  .btn-corte {
    background: var(--cafe); color: var(--birote); font-weight: 800;
    padding: 8px 14px; border-radius: 14px; white-space: nowrap;
  }

  /* ---------- Pantalla de corte ---------- */
  .aviso-auto {
    background: var(--birote-claro); color: var(--cafe); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.4;
  }
  .fecha-corte { text-align: center; color: var(--cafe-claro); margin-bottom: 12px; }
  .nav-dias { display: flex; justify-content: space-between; margin-bottom: 12px; }
  .nav-dias button { background: transparent; color: var(--salsa); font-weight: 800; padding: 6px 4px; }
  .nav-dias button:disabled { opacity: .3; }
  .total-dia {
    background: var(--salsa); color: #fff; border-radius: 20px;
    padding: 18px; text-align: center; margin-bottom: 12px;
  }
  .total-dia .etq { color: var(--birote-claro); font-size: 14px; font-weight: 700; }
  .total-dia .cifra { font-size: 40px; font-weight: 900; letter-spacing: -1px; }
  .cifras { display: flex; gap: 10px; margin-bottom: 18px; }
  .cifras > div {
    flex: 1; background: var(--tarjeta); border: 1.5px solid var(--birote);
    border-radius: 16px; padding: 12px; text-align: center;
  }
  .cifras .num { font-size: 22px; font-weight: 900; color: var(--salsa); }
  .cifras .etq { font-size: 12px; color: var(--cafe-claro); }
  .tabla {
    background: var(--tarjeta); border: 1.5px solid var(--birote-claro);
    border-radius: 16px; padding: 4px 14px; margin-bottom: 8px;
  }
  .tabla .renglon { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--birote-claro); }
  .tabla .renglon:last-child { border-bottom: none; }
  .tabla .cant { font-weight: 900; color: var(--salsa); min-width: 30px; }
  .tabla .desc { flex: 1; min-width: 0; }
  .tabla .monto { font-weight: 800; }

  /* ---------- Barra inferior café ---------- */
  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--cafe);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .barra .total-grande { color: var(--birote); font-weight: 900; font-size: 26px; max-width: 640px; margin: 0 auto; }
  .barra .botones { display: flex; gap: 12px; margin: 10px auto 0; max-width: 640px; }
  .barra .botones button { flex: 1; padding: 14px; border-radius: 22px; font-weight: 800; }
  .btn-contorno { background: transparent; color: var(--birote-claro); border: 1.5px solid var(--birote-claro) !important; }

  /* ---------- Avisos ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom));
    transform: translateX(-50%); background: var(--cafe); color: #fff;
    padding: 12px 18px; border-radius: 14px; font-size: 15px; z-index: 20;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center;
  }
  .toast.visible { opacity: 1; }
  .aviso {
    background: var(--salsa-clara); color: var(--salsa-oscura);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.4;
  }

  /* ---------- Hoja de respaldo ---------- */
  .fondo-hoja { position: fixed; inset: 0; background: rgba(59,35,20,.45); z-index: 30; display: none; }
  .fondo-hoja.visible { display: block; }
  .hoja {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--crema); border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
  }
  .hoja h2 { margin: 0 0 6px; color: var(--salsa); font-weight: 900; }
  .hoja p { margin: 0 0 14px; color: var(--cafe-claro); font-size: 14px; line-height: 1.4; }
  .hoja button { width: 100%; margin-bottom: 10px; padding: 14px; }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<div class="fondo-hoja" id="fondoHoja">
  <div class="hoja">
    <h2>Respaldo</h2>
    <p>Guarda una copia de todas las órdenes en un archivo, por si se borran los datos del navegador.</p>
    <button class="btn btn-rojo" id="btnExportar">Descargar respaldo</button>
    <button class="btn btn-dorado" id="btnImportar">Restaurar desde archivo</button>
    <button class="btn btn-texto" id="btnCerrarHoja">Cerrar</button>
    <input type="file" id="archivo" accept=".json,application/json" hidden>
  </div>
</div>

<script>
// ================== MENÚ (cambia aquí precios y nombre) ==================
const NEGOCIO = "Tortas Ahogadas Leoo";
const TELEFONO_NEGOCIO = "3337805578";
const PRECIO_REFRESCO = 25; // OJO: no me diste este precio, cámbialo

const CATEGORIAS = ["Tortas", "Tacos dorados", "Bebidas"];
const PRODUCTOS = [
  { id: "torta_carnitas", nombre: "Torta de carnitas",     precio: 60, cat: "Tortas" },
  { id: "torta_buche",    nombre: "Torta de buche",        precio: 60, cat: "Tortas" },
  { id: "torta_lengua",   nombre: "Torta de lengua",       precio: 60, cat: "Tortas" },
  { id: "torta_surtida",  nombre: "Torta surtida",         precio: 60, cat: "Tortas" },
  { id: "mini_torta",     nombre: "Mini torta",            precio: 35, cat: "Tortas" },
  { id: "taco_papa",      nombre: "Taco dorado de papa",   precio: 10, cat: "Tacos dorados" },
  { id: "taco_frijol",    nombre: "Taco dorado de frijol", precio: 10, cat: "Tacos dorados" },
  { id: "taco_papa_carne",   nombre: "Taco de papa con carne",   precio: 25, cat: "Tacos dorados" },
  { id: "taco_frijol_carne", nombre: "Taco de frijol con carne", precio: 25, cat: "Tacos dorados" },
  { id: "agua_litro",     nombre: "Agua (1 L)",            precio: 30, cat: "Bebidas" },
  { id: "agua_chica",     nombre: "Agua chica",            precio: 20, cat: "Bebidas" },
  { id: "refresco",       nombre: "Refresco",              precio: PRECIO_REFRESCO, cat: "Bebidas" }
];

// ================== GUARDADO (localStorage) ==================
const CLAVE = "ordenes_tortas";

// Revisa si el navegador deja guardar (en algunos modos no deja)
const puedeGuardar = (() => {
  try {
    localStorage.setItem("__prueba", "1");
    localStorage.removeItem("__prueba");
    return true;
  } catch (e) { return false; }
})();

let memoria = []; // por si no se puede guardar, al menos funciona mientras esté abierta

function obtenerOrdenes() {
  if (!puedeGuardar) return memoria;
  try { return JSON.parse(localStorage.getItem(CLAVE)) || []; }
  catch (e) { return []; }
}

function escribirOrdenes(lista) {
  memoria = lista;
  if (!puedeGuardar) return;
  try { localStorage.setItem(CLAVE, JSON.stringify(lista)); }
  catch (e) { toast("No se pudo guardar"); }
}

// ---- Número de orden (1, 2, 3...) ----
const CLAVE_CONTADOR = "contador_tortas";

// Le pone número a las órdenes viejas que no tenían (en orden de fecha)
function numerarViejas() {
  const lista = obtenerOrdenes();
  if (lista.every(o => o.numero)) return;
  let n = Math.max(0, ...lista.map(o => o.numero || 0));
  lista.slice().sort((a, b) => a.fecha - b.fecha).forEach(o => { if (!o.numero) o.numero = ++n; });
  escribirOrdenes(lista);
}

// Siguiente número. Usa un contador guardado para no repetir números aunque borres órdenes.
function siguienteNumero() {
  let guardado = 0;
  try { guardado = Number(localStorage.getItem(CLAVE_CONTADOR)) || 0; } catch (e) {}
  const mayor = Math.max(0, ...obtenerOrdenes().map(o => o.numero || 0));
  return Math.max(guardado, mayor) + 1;
}

function guardarOrden(orden) {
  if (!orden.numero) orden.numero = siguienteNumero();
  try { localStorage.setItem(CLAVE_CONTADOR, String(orden.numero)); } catch (e) {}
  escribirOrdenes(obtenerOrdenes().filter(o => o.id !== orden.id).concat(orden));
}

function eliminarOrden(id) {
  escribirOrdenes(obtenerOrdenes().filter(o => o.id !== id));
}

// ================== UTILIDADES ==================
const total = o => o.lineas.reduce((s, l) => s + l.precio * l.cantidad, 0);

function fechaTexto(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// Evita que un nombre con < o > rompa la página
function esc(t) {
  return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("visible");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("visible"), 2200);
}

const ESCURRIDO = `<svg class="escurrido" viewBox="0 0 360 24" preserveAspectRatio="none" aria-hidden="true">
  <path fill="#B5231A" d="M0,0 L360,0 L360,6 C350,6 349,17 341,17 C333,17 333,6 323,6 L292,6 C283,6 284,23 273,23 C262,23 263,6 254,6 L212,6 C204,6 204,13 197,13 C190,13 190,6 182,6 L142,6 C132,6 133,20 122,20 C111,20 112,6 102,6 L72,6 C64,6 64,15 57,15 C50,15 50,6 42,6 L22,6 C16,6 16,11 11,11 C6,11 6,6 0,6 Z"/>
</svg>`;

// ================== RECIBO Y WHATSAPP ==================
function recibo(o) {
  let r = `*${NEGOCIO}*\nOrden #${o.numero}\nCliente: ${o.cliente}\nFecha: ${fechaTexto(o.fecha)}\n--------------------\n`;
  o.lineas.forEach(l => { r += `${l.cantidad} x ${l.nombre}  $${l.precio * l.cantidad}\n`; });
  r += `--------------------\n*TOTAL: $${total(o)}*\n¡Gracias por tu compra!\nPedidos al: ${TELEFONO_NEGOCIO}`;
  return r;
}

function enviarWhatsApp(o) {
  const digitos = (o.telefono || "").replace(/\D/g, "");
  const texto = encodeURIComponent(recibo(o));
  let url;
  if (digitos.length >= 10) {
    const numero = digitos.length === 10 ? "52" + digitos : digitos; // 52 = México
    url = `https://wa.me/${numero}?text=${texto}`;
  } else {
    url = `https://wa.me/?text=${texto}`; // WhatsApp te deja escoger el contacto
  }
  window.location.href = url;
}

// ================== PANTALLA 1: LISTA ==================
function tarjetaOrden(o) {
  return `
    <div class="orden" data-abrir="${o.id}">
      <div class="franja"></div>
      <div class="cuerpo">
        <div class="arriba">
          <div class="cliente"><span class="numero">#${o.numero}</span>${esc(o.cliente)}</div>
          <div class="total">$${total(o)}</div>
        </div>
        <div class="fecha">${fechaTexto(o.fecha)}</div>
        <div class="resumen">${esc(o.lineas.map(l => `${l.cantidad} ${l.nombre}`).join(", "))}</div>
        <div class="acciones">
          <button class="btn btn-texto" data-borrar="${o.id}">Eliminar</button>
          <button class="btn btn-rojo" data-wa="${o.id}">WhatsApp</button>
        </div>
      </div>
    </div>`;
}

let busqueda = "";

function pantallaLista() {
  const ordenes = obtenerOrdenes().sort((a, b) => b.fecha - a.fecha);
  const q = busqueda.trim().toLowerCase().replace(/^#/, "");
  const filtradas = ordenes.filter(o => o.cliente.toLowerCase().includes(q) || String(o.numero) === q);

  document.getElementById("app").innerHTML = `
    <header>
      <div class="fila-header">
        <div class="grow">
          <h1>${esc(NEGOCIO)}</h1>
          <p>Pedidos al: <a href="tel:${TELEFONO_NEGOCIO}" style="color:inherit">${TELEFONO_NEGOCIO}</a></p>
        </div>
        <button class="btn-header" id="btnRespaldo">Respaldo</button>
      </div>
      ${ESCURRIDO}
    </header>
    <main>
      ${puedeGuardar ? "" : `<div class="aviso"><b>Ojo:</b> aquí el navegador no deja guardar. Las órdenes se borran al cerrar la página.</div>`}
      <input class="campo" id="buscar" placeholder="Buscar por nombre o número" value="${esc(busqueda)}" autocomplete="off">
      <div id="lista">
        ${filtradas.length === 0
          ? `<div class="vacio">${busqueda ? "No hay órdenes con esa búsqueda." : "Todavía no hay órdenes.<br>¡A ahogar tortas!"}</div>`
          : agruparPorDia(filtradas).map(([dia, lista]) => `
            <div class="dia">
              <div>
                <div class="nombre-dia">${etiquetaDia(dia)}</div>
                <div class="resumen-dia">${lista.length} ${lista.length === 1 ? "orden" : "órdenes"} · ${dinero(lista.reduce((s, o) => s + total(o), 0))}</div>
              </div>
              <button class="btn-corte" data-corte="${dia}">Corte</button>
            </div>
            ${lista.map(tarjetaOrden).join("")}`).join("")}
      </div>
    </main>
    <button class="fab" id="btnNueva">+ Nueva orden</button>
  `;

  const buscar = document.getElementById("buscar");
  buscar.addEventListener("input", () => {
    busqueda = buscar.value;
    pantallaLista();
    const b = document.getElementById("buscar");
    b.focus();
    b.setSelectionRange(b.value.length, b.value.length);
  });

  document.getElementById("btnNueva").onclick = () => pantallaOrden(null);
  document.getElementById("btnRespaldo").onclick = abrirHoja;

  document.getElementById("lista").onclick = e => {
    const corte = e.target.closest("[data-corte]");
    if (corte) { pantallaCorte(corte.dataset.corte); return; }
    const borrar = e.target.closest("[data-borrar]");
    const wa = e.target.closest("[data-wa]");
    const abrir = e.target.closest("[data-abrir]");
    const buscarId = id => obtenerOrdenes().find(o => o.id === Number(id));

    if (borrar) {
      const o = buscarId(borrar.dataset.borrar);
      if (o && confirm(`¿Borrar la orden de ${o.cliente}?`)) {
        eliminarOrden(o.id);
        pantallaLista();
      }
    } else if (wa) {
      enviarWhatsApp(buscarId(wa.dataset.wa));
    } else if (abrir) {
      pantallaOrden(buscarId(abrir.dataset.abrir));
    }
  };
}

// ================== PANTALLA 2: CREAR / EDITAR ORDEN ==================
function pantallaOrden(inicial) {
  const cant = {}; // productoId -> cantidad (productos del menú)
  const extras = []; // productos de "Otros": { id, nombre, precio, cantidad }
  const esDelMenu = id => PRODUCTOS.some(p => p.id === id);
  if (inicial) inicial.lineas.forEach(l => {
    if (esDelMenu(l.productoId)) cant[l.productoId] = l.cantidad;
    else extras.push({ id: l.productoId, nombre: l.nombre, precio: l.precio, cantidad: l.cantidad });
  });

  document.getElementById("app").innerHTML = `
    <header>
      <div class="fila-header">
        <button class="btn-header" id="btnAtras">‹ Atrás</button>
        <h1 style="font-size:22px">${inicial ? `Editar orden #${inicial.numero}` : "Nueva orden"}</h1>
      </div>
      ${ESCURRIDO}
    </header>
    <main style="padding-bottom:170px">
      <input class="campo" id="cliente" placeholder="Nombre del cliente" autocapitalize="words" autocomplete="off" value="${esc(inicial ? inicial.cliente : "")}">
      <input class="campo" id="telefono" placeholder="WhatsApp (opcional, 10 dígitos)" type="tel" inputmode="tel" value="${esc(inicial ? inicial.telefono : "")}">
      ${CATEGORIAS.map(cat => `
        <div class="categoria">${cat}</div>
        ${PRODUCTOS.filter(p => p.cat === cat).map(p => `
          <div class="producto">
            <div class="info">
              <div class="nombre">${p.nombre}</div>
              <div class="precio">$${p.precio}</div>
            </div>
            <button class="circulo menos" data-menos="${p.id}">−</button>
            <div class="cantidad" id="c_${p.id}">0</div>
            <button class="circulo mas" data-mas="${p.id}">+</button>
          </div>`).join("")}
      `).join("")}
      <div class="categoria">Otros</div>
      <p class="extra-nota">Para algo que no está en el menú. Pon nombre y precio y dale Agregar.</p>
      <div id="listaExtras"></div>
      <div class="otro-form">
        <input class="campo nom" id="otroNombre" placeholder="Nombre" autocomplete="off" autocapitalize="sentences">
        <input class="campo pre" id="otroPrecio" placeholder="Precio" type="number" inputmode="decimal" min="0" step="any">
        <button class="btn-dorado" id="btnAgregarOtro">Agregar</button>
      </div>
    </main>
    <div class="barra">
      <div class="total-grande" id="total">Total: $0</div>
      <div class="botones">
        <button class="btn-contorno" id="btnGuardar">Guardar</button>
        <button class="btn-rojo" id="btnEnviar">Guardar y enviar</button>
      </div>
    </div>
  `;

  function pintarExtras() {
    document.getElementById("listaExtras").innerHTML = extras.map(x => `
      <div class="producto">
        <div class="info">
          <div class="nombre">${esc(x.nombre)}</div>
          <div class="precio">$${x.precio}</div>
        </div>
        <button class="circulo menos" data-xmenos="${x.id}" aria-label="Quitar uno">−</button>
        <div class="cantidad">${x.cantidad}</div>
        <button class="circulo mas" data-xmas="${x.id}" aria-label="Agregar uno">+</button>
      </div>`).join("");
  }

  function refrescar() {
    let t = extras.reduce((s, x) => s + x.precio * x.cantidad, 0);
    PRODUCTOS.forEach(p => {
      const c = cant[p.id] || 0;
      t += c * p.precio;
      document.getElementById("c_" + p.id).textContent = c;
      document.querySelector(`[data-menos="${p.id}"]`).disabled = c === 0;
    });
    document.getElementById("total").textContent = `Total: $${t}`;
  }

  document.querySelector("main").onclick = e => {
    const mas = e.target.closest("[data-mas]");
    const menos = e.target.closest("[data-menos]");
    if (mas) cant[mas.dataset.mas] = (cant[mas.dataset.mas] || 0) + 1;
    if (menos && cant[menos.dataset.menos] > 0) cant[menos.dataset.menos]--;
    if (mas || menos) refrescar();

    const xmas = e.target.closest("[data-xmas]");
    const xmenos = e.target.closest("[data-xmenos]");
    if (xmas || xmenos) {
      const id = (xmas || xmenos).dataset[xmas ? "xmas" : "xmenos"];
      const x = extras.find(x => x.id === id);
      if (xmas) x.cantidad++;
      else if (--x.cantidad <= 0) extras.splice(extras.indexOf(x), 1); // en 0 se quita
      pintarExtras();
      refrescar();
    }
  };

  document.getElementById("btnAgregarOtro").onclick = () => {
    const nom = document.getElementById("otroNombre");
    const pre = document.getElementById("otroPrecio");
    const nombre = nom.value.trim();
    const precio = Math.round(Number(pre.value) * 100) / 100;
    if (!nombre) { toast("Ponle nombre"); nom.focus(); return; }
    if (!pre.value || !(precio > 0)) { toast("Pon un precio válido"); pre.focus(); return; }
    extras.push({ id: "otro_" + Date.now(), nombre, precio, cantidad: 1 });
    nom.value = ""; pre.value = "";
    nom.blur(); pre.blur();
    pintarExtras();
    refrescar();
  };

  function construirOrden() {
    const cliente = document.getElementById("cliente").value.trim();
    if (!cliente) { toast("Pon el nombre del cliente"); return null; }
    const lineas = PRODUCTOS
      .filter(p => (cant[p.id] || 0) > 0)
      .map(p => ({ productoId: p.id, nombre: p.nombre, precio: p.precio, cantidad: cant[p.id] }))
      .concat(extras.map(x => ({ productoId: x.id, nombre: x.nombre, precio: x.precio, cantidad: x.cantidad })));
    if (lineas.length === 0) { toast("La orden está vacía"); return null; }
    return {
      id: inicial ? inicial.id : Date.now(),
      numero: inicial ? inicial.numero : undefined,
      cliente,
      telefono: document.getElementById("telefono").value.trim(),
      lineas,
      fecha: inicial ? inicial.fecha : Date.now()
    };
  }

  document.getElementById("btnAtras").onclick = pantallaLista;
  document.getElementById("btnGuardar").onclick = () => {
    const o = construirOrden();
    if (o) { guardarOrden(o); pantallaLista(); toast("Orden guardada"); }
  };
  document.getElementById("btnEnviar").onclick = () => {
    const o = construirOrden();
    if (o) { guardarOrden(o); pantallaLista(); enviarWhatsApp(o); }
  };

  pintarExtras();
  refrescar();
  window.scrollTo(0, 0);
}

// ================== CORTE DEL DÍA ==================
// "2026-10-18" según la hora del celular
function claveDia(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function fechaDeClave(clave) {
  const [a, m, d] = clave.split("-").map(Number);
  return new Date(a, m - 1, d);
}

function etiquetaDia(clave) {
  const hoy = claveDia(Date.now());
  const ayer = claveDia(Date.now() - 86400000);
  if (clave === hoy) return "Hoy";
  if (clave === ayer) return "Ayer";
  return mayus(fechaDeClave(clave).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "short" }));
}

const mayus = t => t.charAt(0).toUpperCase() + t.slice(1);

function dinero(n) {
  return "$" + n.toLocaleString("es-MX", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

// [[dia, [ordenes...]], ...] del día más reciente al más viejo
function agruparPorDia(ordenes) {
  const grupos = {};
  ordenes.forEach(o => { (grupos[claveDia(o.fecha)] ||= []).push(o); });
  return Object.keys(grupos).sort().reverse().map(k => [k, grupos[k].sort((a, b) => b.fecha - a.fecha)]);
}

function calcularCorte(clave) {
  const ordenes = obtenerOrdenes().filter(o => claveDia(o.fecha) === clave).sort((a, b) => a.fecha - b.fecha);
  const totalDia = ordenes.reduce((s, o) => s + total(o), 0);

  // Suma por producto (los "otros" con el mismo nombre y precio se juntan)
  const porProducto = {};
  ordenes.forEach(o => o.lineas.forEach(l => {
    const k = l.nombre + "|" + l.precio;
    porProducto[k] ||= { nombre: l.nombre, cantidad: 0, monto: 0 };
    porProducto[k].cantidad += l.cantidad;
    porProducto[k].monto += l.cantidad * l.precio;
  }));
  const productos = Object.values(porProducto).sort((a, b) => b.monto - a.monto);

  return {
    clave, ordenes, totalDia, productos,
    promedio: ordenes.length ? totalDia / ordenes.length : 0,
    piezas: productos.reduce((s, p) => s + p.cantidad, 0)
  };
}

function textoCorte(c) {
  const fecha = mayus(fechaDeClave(c.clave).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
  let r = `*${NEGOCIO}*\n*Corte del día*\n${fecha}\n--------------------\n`;
  r += `Órdenes: ${c.ordenes.length}\n`;
  if (c.ordenes.length) r += `De la #${c.ordenes[0].numero} a la #${c.ordenes[c.ordenes.length - 1].numero}\n`;
  r += `--------------------\n`;
  c.productos.forEach(p => { r += `${p.cantidad} x ${p.nombre}  ${dinero(p.monto)}\n`; });
  r += `--------------------\n*TOTAL VENDIDO: ${dinero(c.totalDia)}*\n`;
  r += `Ticket promedio: ${dinero(Math.round(c.promedio * 100) / 100)}`;
  return r;
}

  document.getElementById("app").innerHTML = `

    <main style="padding-bottom:110px">

      <div class="nav-dias">
        <button id="btnAnterior" ${anterior ? "" : "disabled"}>‹ Día anterior</button>
        <button id="btnSiguiente" ${siguiente ? "" : "disabled"}>Día siguiente ›</button>

      <div class="fecha-corte">${etiquetaDia(clave) === "Hoy" || etiquetaDia(clave) === "Ayer" ? etiquetaDia(clave) + " · " + fechaLarga.toLowerCase() : fechaLarga}</div>

      <div class="total-dia">

      </div>
      <div class="cifras">
        <div><div class="num">${c.ordenes.length}</div><div class="etq">órdenes</div></div>
        <div><div class="num">${c.piezas}</div><div class="etq">productos</div></div>
        <div><div class="num">${dinero(Math.round(c.promedio))}</div><div class="etq">promedio</div></div>
      </div>

      <button class="btn btn-dorado" id="btnExcel" style="width:100%;padding:14px;margin-bottom:6px">Descargar Excel (día, semana o mes)</button>
      ${c.ordenes.length === 0 ? `<div class="vacio">No hubo órdenes este día.</div>` : `
        <div class="categoria">Lo que se vendió</div>

          ${c.productos.map(p => `

              <div class="monto">${dinero(total(o))}</div>
            </div>`).join("")}

    </main>

  if (siguiente) document.getElementById("btnSiguiente").onclick = () => pantallaCorte(siguiente);

  };
  document.getElementById("btnCopiar").onclick = async () => {
    try { await navigator.clipboard.writeText(textoCorte(c).replace(/\*/g, "")); toast("Corte copiado"); }
    catch (e) { toast("No se pudo copiar"); }
  };
  window.scrollTo(0, 0);

// ================== REPORTE EN EXCEL (día / semana / mes) ==================
// Carga la librería ExcelJS solo cuando se ocupa (está en la misma carpeta, funciona sin internet)
function cargarExcelJS() {
  if (window.ExcelJS) return Promise.resolve();
  if (cargarExcelJS.p) return cargarExcelJS.p;
  cargarExcelJS.p = new Promise((ok, mal) => {
    const sc = document.createElement("script");
    sc.src = "exceljs.min.js";
    sc.onload = ok;
    sc.onerror = () => { cargarExcelJS.p = null; mal(new Error("No cargó ExcelJS")); };
    document.head.appendChild(sc);
  });
  return cargarExcelJS.p;
}

const DIAS_SEMANA = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

// Rango de fechas del periodo que contiene "clave" (día "2026-10-17")
function periodo(tipo, clave) {
  const d = fechaDeClave(clave);
  let inicio, fin, titulo, archivo;
  const fmt = (x, o) => x.toLocaleDateString("es-MX", o);
  if (tipo === "dia") {
    inicio = d;
    fin = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    titulo = "Reporte del día · " + mayus(fmt(d, { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
    archivo = `corte-dia-${clave}.xlsx`;
  } else if (tipo === "semana") {
    const dow = (d.getDay() + 6) % 7; // lunes = 0
    inicio = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    fin = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + 7);
    const dom = new Date(fin.getTime() - 86400000);
    titulo = `Reporte semanal · ${fmt(inicio, { day: "numeric", month: "short" })} al ${fmt(dom, { day: "numeric", month: "short", year: "numeric" })}`;
    archivo = `corte-semana-${claveDia(inicio.getTime())}.xlsx`;
  } else {
    inicio = new Date(d.getFullYear(), d.getMonth(), 1);
    fin = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    titulo = "Reporte mensual · " + mayus(fmt(inicio, { month: "long", year: "numeric" }));
    archivo = `corte-mes-${clave.slice(0, 7)}.xlsx`;
  }
  return { tipo, inicio, fin, titulo, archivo };
}

async function generarExcel(per) {
  await cargarExcelJS();
  const ordenes = obtenerOrdenes()
    .filter(o => o.fecha >= per.inicio.getTime() && o.fecha < per.fin.getTime())
    .sort((a, b) => a.fecha - b.fecha);

  // ---- Colores de la torta ahogada ----
  const C = { salsa: "FFB5231A", oscura: "FF7F1610", birote: "FFE0A84B", biroteClaro: "FFF6D9A0",
              crema: "FFFFF5E6", tarjeta: "FFFFFBF4", cafe: "FF3B2314", blanco: "FFFFFFFF" };
  const relleno = c => ({ type: "pattern", pattern: "solid", fgColor: { argb: c } });
  const borde = { style: "thin", color: { argb: C.biroteClaro } };
  const bordes = { top: borde, left: borde, bottom: borde, right: borde };
  const DINERO = '"$"#,##0.00';
  // Número de columna a letra: 1 -> A, 27 -> AA
  const col = n => { let t = ""; while (n > 0) { const m = (n - 1) % 26; t = String.fromCharCode(65 + m) + t; n = Math.floor((n - 1) / 26); } return t; };

  const wb = new ExcelJS.Workbook();
  wb.creator = NEGOCIO;
  wb.created = new Date();

  // Título rojo + subtítulo café en las primeras filas
  function titulo(ws, ncols, sub) {
    ws.mergeCells(1, 1, 1, ncols);
    ws.mergeCells(2, 1, 2, ncols);
    ws.mergeCells(3, 1, 3, ncols);
    const t = ws.getCell(1, 1);
    t.value = NEGOCIO;
    t.font = { name: "Arial", size: 20, bold: true, color: { argb: C.blanco } };
    t.fill = relleno(C.salsa);
    t.alignment = { vertical: "middle", horizontal: "left", indent: 1 };
    ws.getRow(1).height = 38;
    const s2 = ws.getCell(2, 1);
    s2.value = sub;
    s2.font = { name: "Arial", size: 12, bold: true, color: { argb: C.birote } };
    s2.fill = relleno(C.cafe);
    s2.alignment = { vertical: "middle", indent: 1 };
    ws.getRow(2).height = 24;
    const s3 = ws.getCell(3, 1);
    s3.value = `Pedidos al: ${TELEFONO_NEGOCIO}   ·   Generado el ${fechaTexto(Date.now())}`;
    s3.font = { name: "Arial", size: 9, italic: true, color: { argb: C.cafe } };
    s3.fill = relleno(C.crema);
    s3.alignment = { indent: 1 };
  }

  function encabezado(ws, fila, textos) {
    const r = ws.getRow(fila);
    textos.forEach((tx, i) => {
      const c = r.getCell(i + 1);
      c.value = tx;
      c.font = { name: "Arial", bold: true, color: { argb: C.blanco } };
      c.fill = relleno(C.salsa);
      c.alignment = { vertical: "middle", horizontal: "center", wrapText: true };
      c.border = bordes;
    });
    r.height = 22;
  }

  function filaDatos(ws, fila, valores, i, formatos = {}) {
    const r = ws.getRow(fila);
    valores.forEach((v, j) => {
      const c = r.getCell(j + 1);
      c.value = v;
      c.font = { name: "Arial", color: { argb: C.cafe } };
      c.fill = relleno(i % 2 ? C.crema : C.tarjeta);
      c.border = bordes;
      c.alignment = { vertical: "middle", wrapText: true };
      if (formatos[j + 1]) c.numFmt = formatos[j + 1];
    });
  }

  function filaTotal(ws, fila, valores, formatos = {}) {
    const r = ws.getRow(fila);
    valores.forEach((v, j) => {
      const c = r.getCell(j + 1);
      c.value = v;
      c.font = { name: "Arial", bold: true, color: { argb: C.birote } };
      c.fill = relleno(C.cafe);
      c.border = bordes;
      if (formatos[j + 1]) c.numFmt = formatos[j + 1];
    });
    r.height = 22;
  }

  function barra(ws, ref) {
    ws.addConditionalFormatting({
      ref,
      rules: [{ type: "dataBar", minLength: 0, maxLength: 100, gradient: false,
                cfvo: [{ type: "num", value: 0 }, { type: "max" }], color: { argb: C.birote } }]
    });
  }

  // ---- Cálculos ----
  const totalOrden = o => total(o);
  const piezasOrden = o => o.lineas.reduce((s, l) => s + l.cantidad, 0);
  const totalPeriodo = ordenes.reduce((s, o) => s + totalOrden(o), 0);
  const piezasPeriodo = ordenes.reduce((s, o) => s + piezasOrden(o), 0);

  // Renglones de "ventas por..." (horas si es día, días si es semana/mes)
  const renglones = [];
  if (per.tipo === "dia") {
    const horas = {};
    ordenes.forEach(o => { (horas[new Date(o.fecha).getHours()] ||= []).push(o); });
    Object.keys(horas).map(Number).sort((a, b) => a - b).forEach(h => {
      const l = horas[h], p = n => String(n).padStart(2, "0");
      renglones.push([`${p(h)}:00 – ${p(h)}:59`, "", l.length, l.reduce((s, o) => s + piezasOrden(o), 0), l.reduce((s, o) => s + totalOrden(o), 0)]);
    });
  } else {
    for (let d = new Date(per.inicio); d < per.fin; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
      const k = claveDia(d.getTime());
      const l = ordenes.filter(o => claveDia(o.fecha) === k);
      renglones.push([DIAS_SEMANA[(d.getDay() + 6) % 7], d.toLocaleDateString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric" }),
                      l.length, l.reduce((s, o) => s + piezasOrden(o), 0), l.reduce((s, o) => s + totalOrden(o), 0)]);
    }
  }
  const mejor = renglones.reduce((m, r) => (r[4] > (m ? m[4] : 0) ? r : m), null);

  // Por producto
  const porProd = {};
  ordenes.forEach(o => o.lineas.forEach(l => {
    const k = l.nombre + "|" + l.precio;
    porProd[k] ||= { nombre: l.nombre, precio: l.precio, cantidad: 0, monto: 0, porDia: {} };
    porProd[k].cantidad += l.cantidad;
    porProd[k].monto += l.cantidad * l.precio;
    const dk = claveDia(o.fecha);
    porProd[k].porDia[dk] = (porProd[k].porDia[dk] || 0) + l.cantidad;
  }));
  const productos = Object.values(porProd).sort((a, b) => b.monto - a.monto);

  // ================= Hoja 1: Resumen =================
  const ws = wb.addWorksheet("Resumen", { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 20 }, { width: 16 }, { width: 14 }, { width: 19 }, { width: 22 }];
  titulo(ws, 5, per.titulo);

  // Tarjetas de cifras (fila 5 etiqueta, fila 6 valor)
  const etiquetas = ["Total vendido", "Órdenes", "Productos", "Ticket promedio", per.tipo === "dia" ? "Hora pico" : "Mejor día"];
  const valores = [totalPeriodo, ordenes.length, piezasPeriodo,
                   ordenes.length ? Math.round(totalPeriodo / ordenes.length * 100) / 100 : 0,
                   mejor ? (per.tipo === "dia" ? mejor[0] : `${mejor[0]} ${mejor[1].slice(0, 5)}`) : "—"];
  etiquetas.forEach((e, i) => {
    const c = ws.getCell(5, i + 1);
    c.value = e.toUpperCase();
    c.font = { name: "Arial", size: 9, bold: true, color: { argb: C.cafe } };
    c.fill = relleno(C.biroteClaro);
    c.alignment = { horizontal: "center" };
    c.border = bordes;
    const v = ws.getCell(6, i + 1);
    v.value = valores[i];
    v.font = { name: "Arial", size: i === 0 ? 18 : 14, bold: true, color: { argb: i === 0 ? C.blanco : C.salsa } };
    v.fill = relleno(i === 0 ? C.salsa : C.tarjeta);
    v.alignment = { horizontal: "center", vertical: "middle" };
    v.border = bordes;
    if (i === 0 || i === 3) v.numFmt = DINERO;
  });
  ws.getRow(6).height = 34;

  // Tabla de ventas por día / hora
  const tituloTabla = ws.getCell(8, 1);
  tituloTabla.value = per.tipo === "dia" ? "Ventas por hora" : "Ventas por día";
  tituloTabla.font = { name: "Arial", size: 13, bold: true, color: { argb: C.salsa } };
  encabezado(ws, 9, per.tipo === "dia" ? ["Hora", "", "Órdenes", "Productos", "Total"] : ["Día", "Fecha", "Órdenes", "Productos", "Total"]);
  const ini = 10;
  if (renglones.length === 0) renglones.push(["Sin ventas", "", 0, 0, 0]);
  renglones.forEach((r, i) => filaDatos(ws, ini + i, r, i, { 5: DINERO }));
  const fin = ini + renglones.length - 1, ft = fin + 1;
  filaTotal(ws, ft, ["TOTAL", "",
    { formula: `SUM(C${ini}:C${fin})`, result: ordenes.length },
    { formula: `SUM(D${ini}:D${fin})`, result: piezasPeriodo },
    { formula: `SUM(E${ini}:E${fin})`, result: totalPeriodo }], { 5: DINERO });
  barra(ws, `E${ini}:E${fin}`);
  ws.pageSetup = { orientation: "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0 };

  // ================= Hoja 2: Productos =================
  const wp = wb.addWorksheet("Productos", { views: [{ state: "frozen", ySplit: 5, showGridLines: false }] });
  wp.columns = [{ width: 6 }, { width: 30 }, { width: 12 }, { width: 12 }, { width: 16 }, { width: 14 }];
  titulo(wp, 6, per.titulo);
  encabezado(wp, 5, ["#", "Producto", "Precio", "Cantidad", "Total", "% de la venta"]);
  const pi = 6;
  const listaProd = productos.length ? productos : [{ nombre: "Sin ventas", precio: 0, cantidad: 0, monto: 0 }];
  listaProd.forEach((p, i) => {
    const r = pi + i;
    filaDatos(wp, r, [i + 1, p.nombre, p.precio, p.cantidad, p.monto,
      { formula: `IF($E$${pi + listaProd.length}=0,0,E${r}/$E$${pi + listaProd.length})`, result: totalPeriodo ? p.monto / totalPeriodo : 0 }],
      i, { 3: DINERO, 5: DINERO, 6: "0.0%" });
    wp.getCell(r, 1).alignment = { horizontal: "center", vertical: "middle" };
  });
  const pf = pi + listaProd.length - 1, pt = pf + 1;
  filaTotal(wp, pt, ["", "TOTAL", "",
    { formula: `SUM(D${pi}:D${pf})`, result: piezasPeriodo },
    { formula: `SUM(E${pi}:E${pf})`, result: totalPeriodo },
    { formula: `SUM(F${pi}:F${pf})`, result: totalPeriodo ? 1 : 0 }], { 5: DINERO, 6: "0.0%" });
  barra(wp, `E${pi}:E${pf}`);

  // ================= Hoja 3: Producto por día (semana y mes) =================
  if (per.tipo !== "dia") {
    const dias = [];
    for (let d = new Date(per.inicio); d < per.fin; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) dias.push(d);
    const n = dias.length + 2; // producto + días + total
    {
      const wd = wb.addWorksheet("Producto por día", { views: [{ state: "frozen", xSplit: 1, ySplit: 5, showGridLines: false }] });
      wd.columns = [{ width: 28 }].concat(dias.map(() => ({ width: per.tipo === "semana" ? 11 : 6 }))).concat([{ width: 10 }]);
      titulo(wd, n, per.titulo + " · cantidades");
      encabezado(wd, 5, ["Producto"].concat(dias.map(d =>
        per.tipo === "semana" ? `${DIAS_SEMANA[(d.getDay() + 6) % 7].slice(0, 3)} ${d.getDate()}` : String(d.getDate()))).concat(["Total"]));
      productos.forEach((p, i) => {
        const r = 6 + i;
        const cant = dias.map(d => p.porDia[claveDia(d.getTime())] || null);
        filaDatos(wd, r, [p.nombre].concat(cant).concat([{ formula: `SUM(B${r}:${col(n - 1)}${r})`, result: p.cantidad }]), i);
        for (let j = 2; j <= n; j++) wd.getCell(r, j).alignment = { horizontal: "center" };
        wd.getCell(r, n).font = { name: "Arial", bold: true, color: { argb: C.salsa } };
      });
      if (productos.length) {
        const ultima = 5 + productos.length;
        filaTotal(wd, ultima + 1, ["TOTAL"].concat(dias.map((d, j) => ({
          formula: `SUM(${col(j + 2)}6:${col(j + 2)}${ultima})`,
          result: productos.reduce((s, p) => s + (p.porDia[claveDia(d.getTime())] || 0), 0)
        }))).concat([{ formula: `SUM(${col(n)}6:${col(n)}${ultima})`, result: piezasPeriodo }]));
        for (let j = 2; j <= n; j++) wd.getCell(ultima + 1, j).alignment = { horizontal: "center" };
        // Mapa de calor: más vendido = más dorado
        wd.addConditionalFormatting({
          ref: `B6:${col(n - 1)}${ultima}`,
          rules: [{ type: "colorScale", cfvo: [{ type: "min" }, { type: "max" }],
                    color: [{ argb: C.tarjeta }, { argb: C.birote }] }]
        });
      }
    }
  }

  // ================= Hoja 4: Órdenes =================
  const wo = wb.addWorksheet("Órdenes", { views: [{ state: "frozen", ySplit: 5, showGridLines: false }] });
  wo.columns = [{ width: 7 }, { width: 12 }, { width: 8 }, { width: 20 }, { width: 14 }, { width: 44 }, { width: 13 }];
  titulo(wo, 7, per.titulo);
  encabezado(wo, 5, ["#", "Fecha", "Hora", "Cliente", "Teléfono", "Pedido", "Total"]);
  ordenes.forEach((o, i) => {
    const f = fechaTexto(o.fecha);
    filaDatos(wo, 6 + i, [o.numero, f.slice(0, 10), f.slice(11), o.cliente, o.telefono || "",
      o.lineas.map(l => `${l.cantidad} x ${l.nombre}`).join(", "), total(o)], i, { 7: DINERO });
    wo.getCell(6 + i, 1).alignment = { horizontal: "center", vertical: "middle" };
  });
  if (ordenes.length) {
    const of = 5 + ordenes.length;
    filaTotal(wo, of + 1, ["", "", "", `${ordenes.length} órdenes`, "", "TOTAL",
      { formula: `SUM(G6:G${of})`, result: totalPeriodo }], { 7: DINERO });
    wo.autoFilter = { from: "A5", to: `G${of}` };
  }

  // Que cada hoja quepa a lo ancho al imprimir
  wb.eachSheet(h => { h.pageSetup = { orientation: h.name === "Resumen" ? "portrait" : "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 } }; });

  const buffer = await wb.xlsx.writeBuffer();
  return { buffer, ordenes: ordenes.length };
}

async function descargarExcel(tipo, clave) {
  const per = periodo(tipo, clave);
  toast("Generando Excel...");
  try {
    const { buffer } = await generarExcel(per);
    const tipoMime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const archivo = new File([buffer], per.archivo, { type: tipoMime });

    // En el iPhone abre el menú de compartir (guardar en Archivos, mandar por WhatsApp, etc.)
    if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
      try { await navigator.share({ files: [archivo], title: per.titulo }); return; }
      catch (e) { if (e.name === "AbortError") return; } // si cancelas, no pasa nada
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(archivo);
    a.download = per.archivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) {
    toast("No se pudo generar el Excel");
  }
}

function abrirHojaExcel(clave) {
  cargarExcelJS().catch(() => {}); // la va cargando mientras eliges
  const d = fechaDeClave(clave);
  const pd = periodo("dia", clave), ps = periodo("semana", clave), pm = periodo("mes", clave);
  const corto = x => x.toLocaleDateString("es-MX", { day: "numeric", month: "short" });
  const fondo = document.createElement("div");
  fondo.className = "fondo-hoja visible";
  fondo.innerHTML = `
    <div class="hoja">
      <h2>Reporte en Excel</h2>
      <p>¿De qué periodo lo quieres?</p>
      <button class="btn btn-rojo" data-tipo="dia">Del día · ${corto(d)}</button>
      <button class="btn btn-rojo" data-tipo="semana">De la semana · ${corto(ps.inicio)} al ${corto(new Date(ps.fin - 86400000))}</button>
      <button class="btn btn-rojo" data-tipo="mes">Del mes · ${pm.inicio.toLocaleDateString("es-MX", { month: "long" })}</button>
      <button class="btn btn-texto" data-tipo="">Cancelar</button>
    </div>`;
  fondo.onclick = e => {
    const b = e.target.closest("[data-tipo]");
    if (e.target !== fondo && !b) return;
    fondo.remove();
    if (b && b.dataset.tipo) descargarExcel(b.dataset.tipo, clave);
  };
  document.body.appendChild(fondo);
}

// Al abrir la app en un día nuevo, muestra solo una vez el corte del último día con ventas
const CLAVE_CORTE_VISTO = "corte_visto";
function corteAutomatico() {
  const hoy = claveDia(Date.now());
  const pasados = agruparPorDia(obtenerOrdenes()).map(([d]) => d).filter(d => d < hoy);
  if (pasados.length === 0) return false;
  const ultimo = pasados[0];
  let visto = "";
  try { visto = localStorage.getItem(CLAVE_CORTE_VISTO) || ""; } catch (e) {}
  if (visto >= ultimo) return false;
  try { localStorage.setItem(CLAVE_CORTE_VISTO, ultimo); } catch (e) {}
  pantallaCorte(ultimo, true);
  return true;
}

// ================== RESPALDO ==================
const fondoHoja = document.getElementById("fondoHoja");
function abrirHoja() { fondoHoja.classList.add("visible"); }
function cerrarHoja() { fondoHoja.classList.remove("visible"); }

document.getElementById("btnCerrarHoja").onclick = cerrarHoja;
fondoHoja.onclick = e => { if (e.target === fondoHoja) cerrarHoja(); };

document.getElementById("btnExportar").onclick = () => {
  const blob = new Blob([JSON.stringify(obtenerOrdenes(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const hoy = new Date().toISOString().slice(0, 10);
  a.download = `respaldo-tortas-${hoy}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

const inputArchivo = document.getElementById("archivo");
document.getElementById("btnImportar").onclick = () => inputArchivo.click();
inputArchivo.onchange = async () => {
  const f = inputArchivo.files[0];
  if (!f) return;
  try {
    const datos = JSON.parse(await f.text());
    if (!Array.isArray(datos)) throw new Error();
    // Junta lo del respaldo con lo que ya hay (sin duplicar por id)
    const actuales = obtenerOrdenes();
    const ids = new Set(actuales.map(o => o.id));
    escribirOrdenes(actuales.concat(datos.filter(o => o && o.id && !ids.has(o.id))));
    numerarViejas();
    cerrarHoja();
    pantallaLista();
    toast("Respaldo restaurado");
  } catch (e) {
    toast("Ese archivo no es un respaldo válido");
  }
  inputArchivo.value = "";
};

numerarViejas();
if (!corteAutomatico()) pantallaLista();

// Registra el service worker (solo funciona en https, como GitHub Pages)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
